name: Local checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Validate Gradle wrapper JAR
        run: echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Check Kotlin formatting
        run: ./gradlew --no-daemon --console=plain checkKotlinFormatting
      - name: Unit tests, lint, debug and R8 builds, benchmark compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            :app:assembleRelease :app:assembleBenchmark :benchmark:assembleBenchmark
      - name: Archive check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          if-no-files-found: ignore
          path: |
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
            app/build/reports/lint-results-*
            app/build/outputs/mapping/**
            benchmark/build/reports/**
